[workspace]
resolver = "2"
members = [
    "core",
    "bindings/python",
    "bindings/android",
    "web/backend",
]
# core/fuzz — отдельный cargo-fuzz проект (Фаза 17, ROADMAP.md), требует
# nightly + libFuzzer-специфичные RUSTFLAGS, несовместимые с остальным
# workspace на stable — держим его вне [workspace].
exclude = ["core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
blake3 = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
bip39 = "2"
rayon = "1"
