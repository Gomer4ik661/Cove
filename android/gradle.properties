android.useAndroidX=true

# Дефолтный heap Gradle-демона (512МБ) слишком мал для R8/dexing
# на release-сборке — OutOfMemoryError при assembleRelease
# (найдено вживую при первой реальной release-сборке после добавления
# BouncyCastle/media3/т.д.). 2Гб — с запасом на этой машине (16Гб+ свободно).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
