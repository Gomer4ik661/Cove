# Линковка через clang-обёртки из Android NDK (см. ROADMAP.md Фаза 14).
# minSdk = 24 (Android 7.0) — разумный baseline по покрытию устройств,
# не связан напрямую со Scoped Storage (это уже API 29 и решается кодом,
# а не минимальной версией NDK-таргета).
#
# `-z max-page-size=16384` — Google Play с конца 2025 требует от новых
# приложений совместимости с устройствами с 16KB page size (реальный
# эмулятор Pixel в SDK уже такой), иначе система показывает
# PageSizeMismatchDialog. Без флага ELF-сегменты .so выравниваются под
# память 4KB.
[target.aarch64-linux-android]
linker = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
linker = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
linker = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.i686-linux-android]
linker = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# blake3 (через cc-rs) компилирует C-путь с NEON-интринсиками и ищет
# компилятор для таргета явно — NDK даёт только версионированные бинарники
# (aarch64-linux-android24-clang), без версии их нет, так что `cc` не
# находит их по умолчанию.
[env]
CC_aarch64_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
AR_aarch64_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
CC_armv7_linux_androideabi = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
AR_armv7_linux_androideabi = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
CC_x86_64_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
AR_x86_64_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
CC_i686_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android24-clang"
AR_i686_linux_android = "/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
